<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Governance Operating Map</title>
  <desc id="desc">Governance root, factory execution, and public surface flow with promotion gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#142235"/>
      <stop offset="100%" stop-color="#1d3048"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2f45" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#263b55" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33d69f"/>
      <stop offset="100%" stop-color="#57f0b9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#091220" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#60f2bf"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="90" y="62" width="1420" height="100" rx="22" fill="#0f1d2d" fill-opacity="0.62" stroke="#4ce0ad" stroke-opacity="0.28"/>
  <text x="130" y="122" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="44" font-weight="700" fill="#ecf6ff">AI Governance Operating System</text>
  <text x="132" y="152" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="23" fill="#9ec0d9">Plan → Review → Execute → Verify → Ship</text>

  <rect x="120" y="220" width="410" height="460" rx="28" fill="url(#card)" stroke="#6ea6d1" stroke-opacity="0.45" filter="url(#softShadow)"/>
  <rect x="152" y="258" width="346" height="8" rx="4" fill="url(#accent)"/>
  <text x="152" y="304" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#eaf5ff">Governance Root</text>
  <text x="152" y="338" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="22" fill="#a7c3da">Decision policy and quality control</text>

  <g font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="21" fill="#d8e7f5">
    <rect x="152" y="374" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="176" y="411">PM routing and ownership lock</text>

    <rect x="152" y="448" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="176" y="485">Spec gate and risk checklist</text>

    <rect x="152" y="522" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="176" y="559">Approval trace + audit links</text>

    <rect x="152" y="596" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="176" y="633">Promotion policy enforcement</text>
  </g>

  <rect x="595" y="220" width="410" height="460" rx="28" fill="url(#card)" stroke="#6ea6d1" stroke-opacity="0.45" filter="url(#softShadow)"/>
  <rect x="627" y="258" width="346" height="8" rx="4" fill="url(#accent)"/>
  <text x="627" y="304" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#eaf5ff">Factory Execution</text>
  <text x="627" y="338" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="22" fill="#a7c3da">Implement, test, and release</text>

  <g font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="21" fill="#d8e7f5">
    <rect x="627" y="374" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="651" y="411">SWE implementation queue</text>

    <rect x="627" y="448" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="651" y="485">Build and regression checks</text>

    <rect x="627" y="522" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="651" y="559">Reviewable commit path</text>

    <rect x="627" y="596" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="651" y="633">Evidence package handoff</text>
  </g>

  <rect x="1070" y="220" width="410" height="460" rx="28" fill="url(#card)" stroke="#6ea6d1" stroke-opacity="0.45" filter="url(#softShadow)"/>
  <rect x="1102" y="258" width="346" height="8" rx="4" fill="url(#accent)"/>
  <text x="1102" y="304" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#eaf5ff">Public Surface</text>
  <text x="1102" y="338" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="22" fill="#a7c3da">pure-flon.com delivery outputs</text>

  <g font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="21" fill="#d8e7f5">
    <rect x="1102" y="374" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="1126" y="411">Product pages and RFQ</text>

    <rect x="1102" y="448" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="1126" y="485">SaaS pricing and tools</text>

    <rect x="1102" y="522" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="1126" y="559">Visual proof and captures</text>

    <rect x="1102" y="596" width="346" height="58" rx="15" fill="#21364f" stroke="#87b3d9" stroke-opacity="0.35"/>
    <text x="1126" y="633">Recruiter-facing narrative</text>
  </g>

  <line x1="540" y1="450" x2="585" y2="450" stroke="#60f2bf" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1015" y1="450" x2="1060" y2="450" stroke="#60f2bf" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="370" y="730" width="860" height="118" rx="24" fill="#0f1f30" fill-opacity="0.84" stroke="#58e9b6" stroke-opacity="0.34"/>
  <text x="430" y="780" font-family="'SF Pro Display','Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#eaf6ff">Promotion Path</text>
  <text x="430" y="818" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="24" fill="#b0cce2">draft → shadow → canary → active</text>
  <text x="900" y="818" font-family="'SF Pro Text','Segoe UI',sans-serif" font-size="24" fill="#67f3bf">with quality-gate checks at every step</text>
</svg>
